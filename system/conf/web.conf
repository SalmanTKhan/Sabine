// Sabine
// Configuration File
//---------------------------------------------------------------------------

// IP to bind the server to
web_bind_ip: 0.0.0.0

// Ports to listen for connections on. You can specify multiple ones,
// for easier switching between clients that might use different ports
// by default, such as Alpha (7000) or newer ones (6900).
web_bind_ports: 5614

// Comma-separated folders used to generate the launcher's root-relative
// patch manifest. The first existing folder is also served under /files.
patch_folders: user/patches

// SMTP is disabled by default. When disabled, the reset request endpoint
// returns the token in JSON for local administration/testing.
smtp_enabled: false
smtp_host:
smtp_port: 25
smtp_username:
smtp_password:
smtp_ssl: false
smtp_from: noreply@localhost
password_reset_base_url: http://127.0.0.1:5614/password-reset

include "/user/conf/web.conf"
