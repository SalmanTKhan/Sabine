// Mail older than this many days is auto-purged from the database by
// MailManager's expiration tick (one sweep every 6 hours). Set to 0
// to disable purging entirely (rows live forever). Items attached to
// expired mail are forfeit — there is no refund-to-sender step.
mail_expire_days: 15

include "/user/conf/world/mail.conf"
