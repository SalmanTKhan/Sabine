// Sabine
// Configuration File
//---------------------------------------------------------------------------

// Item drop rate in percent
item_drop_rate: 100

// The time after which dropped items disappear in seconds
item_disappear_time: 30

// When true, a refine-break failure destroys the item (legacy behaviour).
// When false, the item is force-unequipped and flagged as broken; it
// stays in the player's inventory and can be restored via
// BS_REPAIRWEAPON or @repair.
refine_break_destroys: false

include "/user/conf/world/items.conf"
