// Sabine
// War of Emperium schedule
//
// Drives the auto-Start / auto-End loop in WoeService. The polling
// timer wakes every 30 seconds; when the current UTC day-of-week is
// in `woe_schedule_days` and the wall-clock time falls inside the
// `woe_schedule_start` + `woe_schedule_duration_minutes` window, WoE
// fires automatically. Manual `@agitstart` / `@agitend` chat
// commands continue to work and will pre-empt the schedule.
//---------------------------------------------------------------------------

// Comma-separated days of the week. Accepted: Sun, Mon, Tue, Wed,
// Thu, Fri, Sat (and full names). Default mirrors classic kRO WoE 1.0.
woe_schedule_days: Tue,Thu,Sat

// Start time in 24h HH:MM, UTC.
woe_schedule_start: 20:00

// WoE duration in minutes.
woe_schedule_duration_minutes: 120

include "/user/conf/world/woe.conf"
