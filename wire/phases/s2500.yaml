# S2500 — kRO Sak EP12 / 2008-09-10aSakexe / PV23.
#
# This file lists the active wire surface at this profile, grouped under
# the same headings as docs/interop-s2500-open-midgard.md. Bodies are
# derived from Sabine's emit/consume code at HEAD; see each op's `refs:`
# block for the exact line.
#
# Framing convention (see ../README.md): every op below is preceded on
# the wire by `[wire_id u16 LE]` for fixed-size, or
# `[wire_id u16 LE][total_size u16 LE]` for `size: dynamic`. The `body:`
# blocks exclude those framing bytes; `size:` includes them.

phase: s2500
inherits_from: null
clientexe: 2008-09-10aSakexe
sabine_version_constant: Versions.S2500
packetver: 23

# Coverage notes (2026-05):
# - Sections 1-9 cover the originally-verified 47 ops.
# - Sections 10-22 add ops emitted by Send.* methods or consumed by
#   PacketHandler.* methods at S2500. Wire IDs declared by an explicit
#   Register/Redefine call in PacketTable.2500_sakEP12.cs are populated
#   directly; ops that only inherit from lower-PV registrations carry
#   `wire_id: unknown` + a TODO until a packet capture confirms the
#   runtime value (the Sabine PacketTable's auto-shifting Register
#   semantics make static derivation unreliable for those rows).
#
# Intentional wire-id collisions:
# - 0x0071: HC_ACCEPT_ENTER (dynamic) vs HC_NOTIFY_ZONESVR (28 fixed);
#   client disambiguates by size.
# - 0x0111: ZC_ADD_SKILL vs ZC_SKILLINFO_UPDATE; identical body, server
#   picks which name to emit.
# - 0x02D4: ZC_ITEM_PICKUP_ACK vs ZC_ITEM_PICKUP_ACK3; Sabine routes
#   the legacy op through the v3 wire form at S2500.
# - 0x02D2: ZC_CART_EQUIPMENT_ITEMLIST vs ZC_CART_EQUIPMENT_ITEMLIST3;
#   same routing pattern.
# - 0x02E9: ZC_CART_NORMAL_ITEMLIST vs ZC_CART_NORMAL_ITEMLIST3.

