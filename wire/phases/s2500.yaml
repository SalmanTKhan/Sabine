        body:
          - { name: version,  type: u32 }
          - { name: username, type: string_fixed, length: 24 }
          # MD5 hash of (server-supplied salt || password). 24 bytes
          # because the field is sized for plaintext, not for the hash.
          - { name: password, type: string_fixed, length: 24 }
          - { name: client_type, type: u8 }
          # The remaining 28 bytes carry client-info that Sabine ignores.
          - { name: client_info, type: blob, length: 28 }
