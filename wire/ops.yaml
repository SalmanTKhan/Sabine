  - { name: AC_REFUSE_LOGIN,                     direction: S2C, summary: "Refuse login with reason code." }
  - { name: HC_ACCEPT_ENTER,                     direction: S2C, summary: "Accept char-server enter; send character list." }
  - { name: HC_REFUSE_ENTER,                     direction: S2C, summary: "Refuse char-server enter with reason." }
  - { name: HC_ACCEPT_MAKECHAR,                  direction: S2C, summary: "Accept character creation and return new char data." }
