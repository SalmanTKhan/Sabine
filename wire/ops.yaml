# Sabine wire-format spec: op catalog.
#
# This file lists every NAMED member of the Op enum in
# src/Shared/Network/Op.cs. Placeholder members of the form UNK_03xx are
# intentionally omitted - they exist in the C# enum only to reserve ordinal
# slots between known eras and carry no semantic meaning.
#
# Direction is derived purely from the canonical Ragnarok prefix on the
# enum member name:
#   CA_, CH_, CZ_, CS_   -> C2S       (client to server)
#   AC_, HC_, ZC_, SC_   -> S2C       (server to client; SC_ is a server
#                                      broadcast/cash-shop channel that
#                                      flows in the same direction as ZC_)
#   SERVER_              -> INTERNAL  (inter-server / pseudo op)
#   anything else        -> UNKNOWN   (e.g. COLLECTORDEAD, PING, ZH_*)
#
# IMPORTANT: presence in this file does NOT mean the op is wired up for
# any particular client build. Per-phase body layouts, wire IDs and packet
# sizes live in wire/phases/<phase>.yaml because they vary by protocol
# version. This file is the name+direction catalog only.

ops:

